version: 1
setup:
  - 'pnpm install --frozen-lockfile'
services:
  - name: web
    command: 'pnpm dev'
    preview: true
# The test check is CI's own gate: the Dockerfile's check stage (lint, typecheck, unit tests in the
# release image's environment). Unit tests that pass in a worktree can still fail there.
checks:
  build: 'pnpm run build'
  lint: 'pnpm run lint && pnpm run typecheck && pnpm run format:check'
  test: 'docker build --target check .'
