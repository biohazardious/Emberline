# Production-style stack: `make up` (or `docker compose up -d --build`).
#
# core   — API + web UI. Safe to rebuild/restart at any time: `make upgrade-core`.
# runner — Generic Ubuntu 26.04 LTS + Node 24 LTS developer environment + ptyd.
#          All AI CLIs live in the persistent `runner-tools` (/opt/ai-tools) volume.
name: emberline

services:
  core:
    build:
      context: .
      target: core
    image: emberline/core:local
    restart: unless-stopped
    ports:
      - "${EMBERLINE_BIND:-127.0.0.1}:${EMBERLINE_PORT:-7420}:7420"
    environment:
      # emberline-hook runs in the runner and posts agent hooks back to core.
      EMBERLINE_HOOK_URL: http://core:7420
      # Zone used to read wall-clock reset times such as "resets 2pm" (quota scheduler).
      TZ: ${TZ:-UTC}
    volumes:
      - ptyd-socket:/run/emberline
      - data:/data
      - ${EMBERLINE_WORKSPACES_HOST_DIR:-./workspaces}:/workspaces
      - runner-home:/home/node:ro
      # Read-only: core only inspects installed CLI versions; installs run in the runner via ptyd.
      - runner-tools:/opt/ai-tools:ro
    depends_on:
      runner:
        condition: service_healthy
        restart: false

  runner:
    build:
      context: .
      target: runner
    image: emberline/runner:local
    restart: unless-stopped
    init: true
    environment:
      # Same zone as core, so provider limit banners and core's parser agree.
      TZ: ${TZ:-UTC}
    volumes:
      - ptyd-socket:/run/emberline
      - ${EMBERLINE_WORKSPACES_HOST_DIR:-./workspaces}:/workspaces
      # Persists OAuth credentials (~/.claude, ~/.gemini, ~/.config, etc.) and shell history.
      - runner-home:/home/node
      # Persists dynamically installed & updated AI CLI tools (/opt/ai-tools/bin, /opt/ai-tools/npm).
      - runner-tools:/opt/ai-tools
      - runner-logs:/var/log/emberline

volumes:
  ptyd-socket:
  data:
  runner-home:
  runner-tools:
  runner-logs:
