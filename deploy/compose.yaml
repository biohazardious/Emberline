# Emberline from the published images: a single file for hosts that deploy compose YAML directly
# (TrueNAS "Install via YAML", Portainer, Dockge, plain `docker compose -f deploy/compose.yaml up -d`).
# Building from source uses the compose.yaml in the repository root instead.
#
# Before the first start:
#   - Pick the version: EMBERLINE_VERSION (`latest` by default, a release tag from the GitHub Releases page without
#     the leading v, or `edge` for main).
#   - Choose where the projects live: by default a named volume; set EMBERLINE_WORKSPACES to a host
#     path (for example a TrueNAS dataset such as /mnt/tank/apps/emberline/workspaces) to see and
#     back them up from the host. The runner works as uid 1000, so that path must be writable by it.
#   - The first start prints a one-time setup token in the core log.
# See SECURITY.md before exposing it beyond localhost.
name: emberline

services:
  core:
    image: ghcr.io/biohazardious/emberline-core:${EMBERLINE_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${EMBERLINE_BIND:-127.0.0.1}:${EMBERLINE_PORT:-7420}:7420"
    environment:
      EMBERLINE_HOOK_URL: http://core:7420
      TZ: ${TZ:-UTC}
      # Host names you open Emberline by (reverse proxy, truenas.local). IPs and localhost always work.
      EMBERLINE_ALLOWED_HOSTS: ${EMBERLINE_ALLOWED_HOSTS:-}
      EMBERLINE_METRICS_TOKEN: ${EMBERLINE_METRICS_TOKEN:-}
      # Shows host paths of build outputs when EMBERLINE_WORKSPACES is a host path.
      EMBERLINE_WORKSPACES_HOST_DIR: ${EMBERLINE_WORKSPACES:-}
      # The Docker engine (service `docker`) is on by default; EMBERLINE_DOCKER_ENGINE=0 turns it off
      # (core then gives agents no Docker, even if a host is set).
      EMBERLINE_DOCKER_ENGINE: ${EMBERLINE_DOCKER_ENGINE:-1}
      EMBERLINE_DOCKER_HOST: ${EMBERLINE_DOCKER_HOST:-tcp://docker:2376}
      # Where the runner has the engine's client certificate (core passes it to the CLI there).
      EMBERLINE_DOCKER_CERT_PATH: /run/emberline-docker-certs
      # Preview host ports: the runner publishes the first range (command previews), the docker
      # service the second (compose previews). Keep them disjoint.
      EMBERLINE_PREVIEW_PORTS_RUNNER: ${EMBERLINE_PREVIEW_PORTS_RUNNER:-4300-4324}
      EMBERLINE_PREVIEW_PORTS_DOCKER: ${EMBERLINE_PREVIEW_PORTS_DOCKER:-4325-4349}
    volumes:
      - ptyd-socket:/run/emberline
      - data:/data
      - ${EMBERLINE_WORKSPACES:-workspaces}:/workspaces
      - runner-home:/home/node:ro
      - runner-tools:/opt/ai-tools:ro
    depends_on:
      runner:
        condition: service_healthy
        restart: false

  runner:
    image: ghcr.io/biohazardious/emberline-runner:${EMBERLINE_VERSION:-latest}
    restart: unless-stopped
    init: true
    ports:
      # Command previews (dev servers of runs); core picks their ports from this range.
      - "${EMBERLINE_BIND:-127.0.0.1}:${EMBERLINE_PREVIEW_PORTS_RUNNER:-4300-4324}:${EMBERLINE_PREVIEW_PORTS_RUNNER:-4300-4324}"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ptyd-socket:/run/emberline
      - ${EMBERLINE_WORKSPACES:-workspaces}:/workspaces
      - runner-home:/home/node
      - runner-tools:/opt/ai-tools
      - runner-logs:/var/log/emberline
      # The Docker engine's client certificate (empty while the engine is off); agents may use it.
      - docker-client-certs:/run/emberline-docker-certs:ro
    # Optional: hand a USB serial board to the agents (see compose.usb.yaml in the repository).
    # The board must be plugged in when the runner starts; the device keeps its host name.
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0
    # group_add:
    #   - "20"   # the group owning the device on the host: stat -c %g /dev/ttyACM0

  # Docker engine for agents and compose previews, on by default: EMBERLINE_DOCKER_ENGINE=0 in .env
  # scales it to zero replicas (no container). Rootless Docker-in-Docker; the host's
  # Docker socket is never mounted anywhere. dind must run privileged (rootless included): see
  # SECURITY.md. Its API (tcp 2376) requires client certificates (mutual TLS), which only Emberline's
  # runner holds; nothing else on the compose network, and no container inside the engine, can use it.
  # 2376 has no `ports` entry.
  docker:
    image: docker:29.8.2-dind-rootless
    deploy:
      replicas: ${EMBERLINE_DOCKER_ENGINE:-1}
    restart: unless-stopped
    privileged: true
    environment:
      # The entrypoint keeps a CA and a server certificate here, issues a client certificate into
      # /certs/client and listens on tcp://0.0.0.0:2376 with --tlsverify.
      DOCKER_TLS_CERTDIR: /certs
    ports:
      # Compose previews: a project's service is published on a port of this range (the runner has the other one).
      - "${EMBERLINE_BIND:-127.0.0.1}:${EMBERLINE_PREVIEW_PORTS_DOCKER:-4325-4349}:${EMBERLINE_PREVIEW_PORTS_DOCKER:-4325-4349}"
    volumes:
      # Images, layers and the projects' containers and volumes.
      - docker-data:/home/rootless/.local/share/docker
      # CA and server keys: never leave this container.
      - docker-certs:/certs
      # The client certificate (ca.pem, cert.pem, key.pem), shared read-only with the runner.
      - docker-client-certs:/certs/client
      # Same path as in the runner, so a project's compose bind mounts resolve inside the engine.
      - ${EMBERLINE_WORKSPACES:-workspaces}:/workspaces
    healthcheck:
      test: ["CMD-SHELL", "DOCKER_TLS_VERIFY=1 DOCKER_CERT_PATH=/certs/client docker -H tcp://localhost:2376 version >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 30s

volumes:
  ptyd-socket:
  data:
  workspaces:
  runner-home:
  runner-tools:
  runner-logs:
  docker-data:
  docker-certs:
  docker-client-certs:
