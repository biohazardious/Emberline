name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # lint + typecheck + test run inside the image build (Dockerfile `check` target).
      - name: Check
        run: docker build --target check .
      - name: Build production images
        run: |
          docker build --target core -t emberline/core:ci .
          docker build --target runner -t emberline/runner:ci .
      # Boots core + runner (isolated compose project) and drives the API end to end.
      - name: End-to-end smoke test
        run: make e2e
